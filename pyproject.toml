[project]
name = "minitrue"
version = "0.1"
description = "minitrue configuration system"
authors = [
    {name = "Nicholas Wieland (ngw)",email = "ngw@nofeed.org"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer (>=0.15.3,<0.16.0)",
    "pygpgme (>=0.6,<0.7)",
    "pygit2 (>=1.18.0,<2.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pytomlpp (>=1.0.13,<2.0.0)",
    "inquirer (>=3.4.0,<4.0.0)"
]

[project.scripts]
minitrue = "minitrue.cli:app"

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
inquirer = "^3.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
lint.extend-select = ["C4", "NPY", "PD", "SIM", "TCH"]
lint.ignore = ["E501"]
show-fixes = true
target-version = "py310"
